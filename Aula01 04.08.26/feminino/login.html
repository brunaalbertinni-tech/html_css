<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Floratta</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-page">
  <div class="login-container">
    <h1>Floratta</h1>
    <p>Acesse sua conta</p>
    
    <form>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" placeholder="Digite sua senha">
      </div>
      <button type="button" class="btn btn-primary btn-block" onclick="window.location.href='index.html'">ENTRAR</button>
    </form>
    
    <p style="text-align:center; margin-top:20px; font-size:0.85rem; color:#888;">
      Não tem conta? <a href="#" style="color:#c97b8e; font-weight:600;">Cadastre-se</a>
    </p>
    
    <p style="text-align:center; margin-top:15px; font-size:0.82rem;">
      <a href="index.html" style="color:#c97b8e;">Voltar para a loja</a>
    </p>
  </div>
</div>

</body>
</html>
