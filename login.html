<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Floratta</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-container">
    <h1>Floratta</h1>
    <p>Acesse sua conta ou crie uma nova</p>
    <div class="login-tabs">
      <div class="login-tab active" onclick="switchTab('login',event)">Login</div>
      <div class="login-tab" onclick="switchTab('register',event)">Cadastrar</div>
    </div>
    <form id="login-form">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" required placeholder="seu@email.com"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="login-password" required placeholder="Digite sua senha"></div>
      <button type="submit" class="btn btn-primary btn-block">ENTRAR</button>
    </form>
    <form id="register-form" style="display:none">
      <div class="form-group"><label>Nome completo</label><input type="text" id="reg-name" required placeholder="Seu nome"></div>
      <div class="form-group"><label>Email</label><input type="email" id="reg-email" required placeholder="seu@email.com"></div>
      <div class="form-group"><label>Telefone</label><input type="tel" id="reg-phone" placeholder="(11) 99999-9999"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="reg-password" required minlength="6" placeholder="Minimo 6 caracteres"></div>
      <div class="form-group">
        <label>Senha Mestra (deixe vazio para conta cliente)</label>
        <input type="password" id="reg-master" placeholder="Digite a senha mestra para criar conta admin">
        <small style="color:var(--text-light);font-size:0.75rem;margin-top:5px;display:block">Use a senha mestra para criar uma conta de administrador</small>
      </div>
      <button type="submit" class="btn btn-primary btn-block">CRIAR CONTA</button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:0.82rem;color:var(--text-light)">
      <a href="/" style="color:var(--primary)">Voltar para a loja</a>
    </p>
  </div>
</div>

<script src="/script.js"></script>
<script>
function switchTab(tab, e) {
  document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
}

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value
      })
    });
    const d = await r.json();
    if (d.token) {
      localStorage.setItem('floratta_token', d.token);
      localStorage.setItem('floratta_user', JSON.stringify(d.user));
      if (d.user.role === 'admin') {
        window.location.href = '/admin';
      } else {
        window.location.href = '/';
      }
    } else {
      notify(d.error || 'Erro ao fazer login', 'error');
    }
  } catch(e) { notify('Erro de conexao', 'error'); }
});

document.getElementById('register-form').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('reg-name').value,
        email: document.getElementById('reg-email').value,
        phone: document.getElementById('reg-phone').value,
        password: document.getElementById('reg-password').value,
        master_password: document.getElementById('reg-master').value
      })
    });
    const d = await r.json();
    if (d.token) {
      localStorage.setItem('floratta_token', d.token);
      localStorage.setItem('floratta_user', JSON.stringify(d.user));
      if (d.user.role === 'admin') {
        notify('Conta admin criada com sucesso!');
        setTimeout(() => window.location.href = '/admin', 1000);
      } else {
        notify('Cadastro realizado com sucesso!');
        setTimeout(() => window.location.href = '/', 1000);
      }
    } else {
      notify(d.error || 'Erro ao cadastrar', 'error');
    }
  } catch(e) { notify('Erro de conexao', 'error'); }
});

if (getToken()) {
  const user = getUser();
  if (user) {
    if (user.role === 'admin') window.location.href = '/admin';
    else window.location.href = '/';
  }
}
</script>
</body>
</html>
