<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos - Floratta</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="header">
  <div class="header-top">Frete gratis acima de R$ 199</div>
  <div class="header-main">
    <a href="/" class="logo">Floratta</a>
    <div class="header-actions">
      <a href="/" class="header-action"><span class="header-action-icon">&lt;</span><span>Continuar comprando</span></a>
      <a href="/perfil" class="header-action"><span class="header-action-icon">u</span><span>Perfil</span></a>
    </div>
  </div>
</header>

<div class="cart-page">
  <div class="cart-header">
    <h1>Meus Pedidos</h1>
    <p>Acompanhe o status das suas compras</p>
  </div>
  <div id="orders-content"><div class="loading"><div class="spinner"></div><p>Carregando...</p></div></div>
</div>

<footer class="footer"><div class="footer-bottom"><p>&copy; 2026 Floratta. Todos os direitos reservados.</p></div></footer>

<script src="/script.js"></script>
<script>
async function loadOrders() {
  const token = getToken();
  if (!token) {
    document.getElementById('orders-content').innerHTML = '<div class="empty-state"><h3>Faca login para ver seus pedidos</h3><a href="/login" class="btn btn-primary" style="margin-top:20px">Fazer Login</a></div>';
    return;
  }
  try {
    const r = await fetch('/api/orders', { headers: { 'Authorization': 'Bearer ' + token } });
    const orders = await r.json();
    if (!orders || orders.length === 0) {
      document.getElementById('orders-content').innerHTML = '<div class="empty-state"><h3>Nenhum pedido ainda</h3><p style="margin:15px 0">Voce ainda nao fez nenhum pedido</p><a href="/" class="btn btn-primary" style="margin-top:20px">Fazer Compras</a></div>';
      return;
    }
    const statusLabels = { pending: 'Pendente', shipped: 'Enviado', completed: 'Concluido', cancelled: 'Cancelado' };
    document.getElementById('orders-content').innerHTML = orders.map(order =>
      '<div class="order-card">' +
        '<div class="order-header">' +
          '<div><div class="order-number">Pedido ' + order.order_number + '</div><div class="order-date">' + new Date(order.created_at).toLocaleDateString('pt-BR') + ' as ' + new Date(order.created_at).toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) + '</div></div>' +
          '<span class="order-status ' + order.status + '">' + (statusLabels[order.status] || order.status) + '</span>' +
        '</div>' +
        '<div>' + order.items.map(item =>
          '<div style="display:flex;gap:15px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-light)">' +
            '<img src="' + (item.image || '') + '" alt="' + item.name + '" style="width:70px;height:85px;object-fit:cover;border-radius:8px" onerror="this.style.background=\'var(--primary-soft)\'">' +
            '<div style="flex:1"><strong>' + item.name + '</strong><br><small style="color:var(--text-light)">Tamanho: ' + item.size + ' | Cor: ' + item.color + ' | Qtd: ' + item.quantity + '</small></div>' +
            '<div style="font-weight:600;color:var(--primary-dark)">R$ ' + (item.price * item.quantity).toFixed(2) + '</div>' +
          '</div>'
        ).join('') + '</div>' +
        '<div style="margin-top:15px;padding-top:15px;border-top:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center">' +
          '<span style="color:var(--text-medium)">Total do pedido:</span>' +
          '<span style="font-size:1.3rem;font-weight:700;color:var(--primary-dark)">R$ ' + order.total.toFixed(2) + '</span>' +
        '</div>' +
      '</div>'
    ).join('');
  } catch(e) {
    console.error(e);
    document.getElementById('orders-content').innerHTML = '<div class="empty-state"><p>Erro ao carregar pedidos</p></div>';
  }
}
document.addEventListener('DOMContentLoaded', loadOrders);
</script>
</body>
</html>
