<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho - Floratta</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="header">
  <div class="header-top">Frete gratis acima de R$ 199</div>
  <div class="header-main">
    <a href="/" class="logo">Floratta</a>
    <div class="header-actions">
      <a href="/" class="header-action"><span class="header-action-icon">&lt;</span><span>Continuar comprando</span></a>
    </div>
  </div>
</header>

<div class="cart-page">
  <div class="cart-header">
    <h1>Meu Carrinho</h1>
    <p>Revise seus itens e finalize sua compra</p>
  </div>
  <div id="cart-content"><div class="loading"><div class="spinner"></div><p>Carregando carrinho...</p></div></div>
</div>

<footer class="footer"><div class="footer-bottom"><p>&copy; 2026 Floratta. Todos os direitos reservados.</p></div></footer>

<script src="/script.js"></script>
<script>
async function loadCart() {
  const token = getToken();
  if (!token) {
    document.getElementById('cart-content').innerHTML = '<div class="empty-state"><h3>Faca login para ver seu carrinho</h3><p style="margin:15px 0">Acesse sua conta para continuar</p><a href="/login" class="btn btn-primary" style="margin-top:20px">Fazer Login</a></div>';
    return;
  }
  try {
    const r = await fetch('/api/cart', { headers: { 'Authorization': 'Bearer ' + token } });
    const d = await r.json();
    if (!d.items || d.items.length === 0) {
      document.getElementById('cart-content').innerHTML = '<div class="empty-state"><h3>Seu carrinho esta vazio</h3><p style="margin:15px 0">Adicione produtos para continuar comprando</p><a href="/" class="btn btn-primary" style="margin-top:20px">Ver Produtos</a></div>';
      return;
    }
    document.getElementById('cart-content').innerHTML =
      '<div class="cart-layout">' +
        '<div class="cart-items">' + d.items.map(item =>
          '<div class="cart-item">' +
            '<div class="cart-item-image"><img src="' + (item.image || '') + '" alt="' + item.name + '" onerror="this.style.background=\'var(--primary-soft)\'"></div>' +
            '<div class="cart-item-info">' +
              '<h3>' + item.name + '</h3>' +
              '<div class="cart-item-meta"><span>Tamanho: ' + item.size + '</span><span>Cor: ' + item.color + '</span></div>' +
              '<div class="cart-item-qty"><button onclick="updateQty(' + item.id + ', ' + (item.quantity - 1) + ')">-</button><span>' + item.quantity + '</span><button onclick="updateQty(' + item.id + ', ' + (item.quantity + 1) + ')">+</button></div>' +
            '</div>' +
            '<div class="cart-item-right">' +
              '<div class="cart-item-price">' + fmt((item.sale_price || item.price) * item.quantity) + '</div>' +
              '<button class="cart-item-remove" onclick="removeItem(' + item.id + ')">Remover</button>' +
            '</div>' +
          '</div>'
        ).join('') + '</div>' +
        '<div class="cart-summary">' +
          '<h3>Resumo do Pedido</h3>' +
          '<div class="cart-summary-row"><span>Subtotal</span><span>' + fmt(d.total) + '</span></div>' +
          '<div class="cart-summary-row"><span>Frete</span><span style="color:var(--success)">Gratis</span></div>' +
          '<div class="cart-summary-row total"><span>Total</span><span>' + fmt(d.total) + '</span></div>' +
          '<div class="address-field"><label>Endereco de entrega</label><textarea id="delivery-address" placeholder="Digite seu endereco completo (Rua, numero, bairro, cidade, CEP)"></textarea></div>' +
          '<button class="btn btn-primary btn-block" onclick="checkout()" style="margin-top:15px">FINALIZAR COMPRA</button>' +
          '<button class="btn btn-outline btn-block" onclick="clearCart()" style="margin-top:10px">Limpar Carrinho</button>' +
        '</div>' +
      '</div>';
  } catch(e) {
    console.error(e);
    document.getElementById('cart-content').innerHTML = '<div class="empty-state"><p>Erro ao carregar carrinho</p></div>';
  }
}

async function updateQty(id, qty) {
  if (qty < 1) return;
  const token = getToken();
  await fetch('/api/cart/' + id, {
    method: 'PUT',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ quantity: qty })
  });
  loadCart();
  updateCartCount();
}

async function removeItem(id) {
  if (!confirm('Remover este item do carrinho?')) return;
  const token = getToken();
  await fetch('/api/cart/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
  loadCart();
  updateCartCount();
  notify('Item removido');
}

async function clearCart() {
  if (!confirm('Limpar todo o carrinho?')) return;
  const token = getToken();
  await fetch('/api/cart', { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
  loadCart();
  updateCartCount();
  notify('Carrinho limpo');
}

async function checkout() {
  const address = document.getElementById('delivery-address').value.trim();
  if (!address) { notify('Por favor, digite o endereco de entrega', 'error'); return; }
  const token = getToken();
  try {
    const r = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ address: address, payment_method: 'credit_card' })
    });
    const d = await r.json();
    if (d.message) {
      notify('Pedido realizado com sucesso! Numero: ' + d.order_number);
      setTimeout(() => window.location.href = '/pedidos', 1500);
    } else {
      notify('Erro: ' + d.error, 'error');
    }
  } catch(e) {
    notify('Erro ao finalizar pedido', 'error');
  }
}

document.addEventListener('DOMContentLoaded', loadCart);
</script>
</body>
</html>
